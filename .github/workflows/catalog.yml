name: Catalog data checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Temporary formatting diagnostic
        run: npx prettier src/catalog/validate.ts | base64 -w0 && echo
      - run: node --experimental-strip-types --test tests/catalog.test.mjs
      - run: npm run check
